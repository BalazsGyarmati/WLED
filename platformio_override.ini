[platformio]
default_envs = esp32s3dev_8MB_opi_uart

; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2: 4MB flash, 2MB QSPI PSRAM) bug build.
; Same UART/serial-events flags as esp32s3dev_8MB_opi_uart, but on the 4MB/qspi base env —
; the 8MB_opi partition table puts the filesystem beyond a 4MB chip's flash.
; NOTE: the base env writes the CDC flags without a space (-DARDUINO_…), so the unflags
; below must match that form exactly.
[env:esp32s3zero_4M_uart]
extends = env:esp32s3_4M_qspi
build_unflags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_flags =
  ${env:esp32s3_4M_qspi.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=0
  -D USERMOD_SERIAL_EVENTS

[env:esp32s3dev_8MB_opi_uart]
extends = env:esp32s3dev_8MB_opi
build_unflags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
build_flags =
  ${env:esp32s3dev_8MB_opi.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=0
  -D USERMOD_SERIAL_EVENTS
